# نشر دالة sync في Supabase (المُشغّل والبريد وتسجيل الدخول) من المستودع نفسه — المرحلة ٥، ١٩ أكتوبر ٢٠٢٦
# قبل كده النشر كان بإرسال الملفات السبعة (نحو ١٤٠ ألف حرف) في طلب واحد من أداة النشر، وبعده مقارنة حرف بحرف. النسخة ٥٤ مقدرتش
# تتبعت (الطلب أكبر من اللي ينفع يتكتب في رسالة واحدة)، فالبريد فضل شغّال بمحرك أقدم من الأداة. هنا Supabase CLI بيرفع ملفات
# المستودع زي ما هي — الطريقة الموثّقة (Supabase Docs، «Deploy to Production» → «CI/CD deployment» → GitHub Actions).
# البوابة: main مبيوصلوش غير إيداع نجحت اختباراته على staging (.github/scripts/ship.sh)، فالنشر من main = نشر إيداع متختبر.
# بعده: المقارنة حرف بحرف بأداة القراءة (get_edge_function) زي الأول، ومعاينة البريد — supabase/README.md
# الأدوات متثبّتة على بصمة إيداع (نفس قاعدة tests.yml)، وإصدار الـ CLI متثبّت مش «latest»
name: deploy-sync

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sync/**'
      - '.github/workflows/deploy-sync.yml'

permissions:
  contents: read

# نشرين ورا بعض لنفس الدالة: التاني يستنى الأول، ومحدش بيتلغي في النص
concurrency:
  group: deploy-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rhrrnxsgodiideqeollo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.120.0

      # verify_jwt = false: الدالة بتعمل التحقق بنفسها (الدخول للأداة + صلاحية Meta — index.ts)، وفيها عمليات عامة
      # (النبض، رابط الإيقاف، طلب الانضمام). --use-api: التجميع على خوادم Supabase من غير Docker
      - name: Deploy sync
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; fi
          supabase functions deploy sync --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          echo "::notice title=sync deployed::commit $GITHUB_SHA"
