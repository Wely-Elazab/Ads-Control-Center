# التكامل المستمر (مراجعة المرحلة ٢، ١٢ أكتوبر ٢٠٢٦ — ب١): كل دفع بيشغّل الاختبارات نفسها اللي بتتشغّل محلياً
# (Live/tests/index.html) في Chromium من غير واجهة، والنتيجة بتظهر جنب كل إيداع على GitHub.
# البوابة قبل النشر (Software Engineering at Google، فصل ٢٣ — الاختبار قبل الدمج «presubmit»): كل تغيير بيتدفع لفرع staging
# الأول، ولما الاختبارات تنجح على نفس الإيداع بالظبط بيتدفع لـ main — وCloudflare بينشر من main.
# (فرع release اتجرّب ١٢ أكتوبر كفرع نشر من Cloudflare، وبناء إيداع الإصلاح b6b624b فشل عليه من غير سبب ظاهر — فرجعنا
# لـ main، والبوابة بقت من ناحيتنا من غير ما نعتمد على إعداد في Cloudflare. audit/postmortem-2026-10-12-connect.md)
name: tests

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # المُشغّل في Supabase بيحمّل محرك الأداة من GitHub على إيداع ثابت (ENGINE_COMMIT في runner.ts).
      # لو ملفات المحرك اتغيّرت بعده من غير ما الرقم يتحدّث، الرسائل بتتبعت بمحرك أقدم من اللي في الأداة
      - name: Engine pin matches the engine files
        run: |
          pin=$(grep -oE "ENGINE_COMMIT = '[0-9a-f]{40}'" supabase/functions/sync/runner.ts | grep -oE '[0-9a-f]{40}')
          files="Live/js/i18n.js Live/js/alerts.js Live/js/core.js Live/js/diagnosis.js Live/js/meta.js"
          if ! git diff --quiet "$pin" HEAD -- $files; then
            echo "::error file=supabase/functions/sync/runner.ts::ENGINE_COMMIT ($pin) is older than the engine files. Pin the latest engine commit and redeploy sync."
            git diff --stat "$pin" HEAD -- $files
            exit 1
          fi
          echo "engine pin $pin matches"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Chromium (Playwright)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run the tests
        run: |
          python3 .github/scripts/serve_tests.py &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/tests/index.html > /dev/null && break; sleep 0.5; done
          node .github/scripts/run_tests.mjs

  # دالة sync في Supabase (Deno): الدخول والتشفير والروابط الموقّعة وربط Meta المحفوظ — من غير شبكة ولا قاعدة بيانات
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run the sync function tests
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          # باسم الملف: Deno لوحده بيدوّر على *_test.ts بس، واسم Supabase المقترح (sync-test.ts) مش منهم
          deno test --allow-env --no-check supabase/functions/tests/sync-test.ts 2>&1 | tee deno-test.txt
          echo "::notice title=sync tests::$(grep -E '^(ok|FAILED) \|' deno-test.txt | tail -1)"
      # فحص الأنواع للتقرير بس: Supabase بتنشر من غيره، فأخطاؤه مش أعطال تشغيل — بس بتتسجّل عشان تتصلّح.
      # كل خطأ بيطلع ملاحظة (annotation) بمكانه، عشان يتقري من غير دخول للسجل
      - name: Type-check the sync function (report only)
        continue-on-error: true
        env:
          NO_COLOR: '1'
        run: |
          set +e
          deno check supabase/functions/sync/index.ts > deno-check.txt 2>&1
          status=$?
          cat deno-check.txt
          grep -E 'TS[0-9]+ \[ERROR\]|^ +at file://' deno-check.txt | paste - - | head -20 | sed -E 's#file://[^ ]*/supabase/#supabase/#' |
            while IFS= read -r line; do echo "::warning title=sync types::$line"; done
          grep -E '^(Found|error:)' deno-check.txt | tail -1 | while IFS= read -r line; do echo "::warning title=sync types::$line"; done
          exit $status
